# Serves the built SPA behind the main nginx (src/nginx/nginx.conf.template),
# which handles gzip, /api and /static.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Content-hashed bundle files never change: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Un-hashed public images/icons: cache a day, then revalidate.
    location /imgs/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # index.html (and SPA routes) always revalidate so deploys show up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
