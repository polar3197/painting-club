events {
    worker_connections 1024;
}

http {
    # Correct Content-Type for static files (audio/x-m4a, application/pdf,
    # image/jpeg, ...). Without this every static file is served as text/plain
    # (nginx's default_type), which AVPlayer and PDF viewers reject.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend {
        server api:8000;
    }

    upstream frontend {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name localhost;

        # Profile pics and their thumbs get overwritten in place on re-upload,
        # so they must NOT be marked immutable. no-cache forces revalidation;
        # nginx returns 304 via ETag (from file mtime) when unchanged, fresh bytes when not.
        location /static/profile/ {
            alias /app/static/profile/;
            add_header Cache-Control "no-cache, must-revalidate";
        }
        location /static/profile-thumbs/ {
            alias /app/static/profile-thumbs/;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Inspiration-web external art is member-gated: the api's
        # GET /external-art/{id}/image route is the only way in, so the raw
        # files must not be reachable here (mirrors the profile-thumbs lockdown).
        location /static/external/ {
            return 404;
        }
        location /static/external-thumbs/ {
            return 404;
        }

        # Everything else under /static/ is id-keyed and truly immutable (art, art thumbs).
        location /static/ {
            alias /app/static/;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # API requests
        location /api/ {
            client_max_body_size 20M;
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend requests
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for hot reload
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
